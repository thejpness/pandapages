services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pandapages
      POSTGRES_USER: pandapages
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandapages_app -d pandapages"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    labels:
      - traefik.enable=false

  migrate:
    build:
      context: ./apps/api
      target: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/migrations:/migrations:ro
    networks: [internal]
    labels:
      - traefik.enable=false
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL must use the dedicated migration role}
      GOOSE_MIGRATION_DIR: /migrations
    # The database URL remains in the migration container environment rather
    # than the Goose process arguments.
    command: ["up"]

  api:
    build:
      context: ./apps/api
      target: prod
      args:
        API_MAIN: ./cmd/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL must use the dedicated application role}
      PGAPPNAME: pandapages-api
      PP_ASSET_DIR: /data/assets
      PP_LOG_LEVEL: ${PP_LOG_LEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PP_ADMIN_KEY: ${PP_ADMIN_KEY:?PP_ADMIN_KEY is required}
      PP_SUPABASE_ISSUER: ${SUPABASE_URL:?SUPABASE_URL must be the exact HTTPS Auth origin}/auth/v1
      PP_SUPABASE_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:?SUPABASE_JWT_AUDIENCE is required}
      PP_SUPABASE_JWKS_URL: ${SUPABASE_URL:?SUPABASE_URL must be the exact HTTPS Auth origin}/auth/v1/.well-known/jwks.json
    volumes:
      - assets:/data/assets
    networks: [traefik, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik

      - traefik.http.services.pandapages-api.loadbalancer.server.port=8080

      # Admin API: Supabase bearer authentication and owner membership are
      # enforced by the Go API. Traefik additionally injects the independent
      # server-side admin key; the browser never receives it.
      - traefik.http.routers.pandapages-api-admin.rule=(Host(`panda-pages.com`) || Host(`www.panda-pages.com`)) && PathPrefix(`/api/v1/admin/`)
      - traefik.http.routers.pandapages-api-admin.entrypoints=websecure
      - traefik.http.routers.pandapages-api-admin.tls=true
      - traefik.http.routers.pandapages-api-admin.tls.certresolver=myresolver
      - traefik.http.routers.pandapages-api-admin.priority=200
      - traefik.http.routers.pandapages-api-admin.service=pandapages-api
      - traefik.http.routers.pandapages-api-admin.middlewares=pandapages-admin-key@docker

      # Inject the independent admin header server-side.
      - traefik.http.middlewares.pandapages-admin-key.headers.customrequestheaders.X-PP-Admin-Key=${PP_ADMIN_KEY:?PP_ADMIN_KEY is required}

      # Public API
      - traefik.http.routers.pandapages-api.rule=(Host(`panda-pages.com`) || Host(`www.panda-pages.com`)) && (PathPrefix(`/api`) || Path(`/healthz`) || Path(`/readyz`))
      - traefik.http.routers.pandapages-api.entrypoints=websecure
      - traefik.http.routers.pandapages-api.tls=true
      - traefik.http.routers.pandapages-api.tls.certresolver=myresolver
      - traefik.http.routers.pandapages-api.priority=100
      - traefik.http.routers.pandapages-api.service=pandapages-api

  web:
    build:
      context: ./apps/web
      target: prod
      args:
        VITE_API_BASE: ""
        VITE_SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be the exact HTTPS Auth origin}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
        SUPABASE_AUTH_ORIGIN: ${SUPABASE_URL:?SUPABASE_URL must be the exact HTTPS Auth origin}
    restart: unless-stopped
    depends_on: [api]
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.services.pandapages-web.loadbalancer.server.port=8080
      - traefik.http.routers.pandapages-web.rule=(Host(`panda-pages.com`) || Host(`www.panda-pages.com`)) && !PathPrefix(`/api`) && !Path(`/healthz`) && !Path(`/readyz`)
      - traefik.http.routers.pandapages-web.entrypoints=websecure
      - traefik.http.routers.pandapages-web.tls=true
      - traefik.http.routers.pandapages-web.tls.certresolver=myresolver
      - traefik.http.routers.pandapages-web.priority=10

networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  pgdata: {}
  assets: {}

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
